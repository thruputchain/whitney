[project]
name = "whitney"
version = "0.1.0"
description = "Reproducible EC2 benchmark harness for Thruput (hogd) executor scaling"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = ["matplotlib"]

[project.scripts]
whitney = "whitney.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["whitney"]

[tool.pytest.ini_options]
testpaths = ["tests"]
